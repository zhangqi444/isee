<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ISEE Lower Level practice — every question from the study workbooks, offline-capable.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F7A6B">
<title>Sheila's ISEE Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F2F5F4; --card:#FFFFFF; --sunk:#E7ECEA;
  --ink:#16211F; --muted:#5C6B68; --faint:#8A9995;
  --line:#D8E0DD; --line-soft:#E7ECEA;
  --accent:#0F7A6B; --accent-soft:#DCEBE7; --accent-ink:#0A5A4E;
  --good:#2E7D5B; --good-soft:#DDEEE4;
  --miss:#B4653A; --miss-soft:#F6E5DC;
  --amber:#9C6F16; --amber-soft:#F5EAD2;
  --shadow:0 1px 2px rgba(22,33,31,.05), 0 6px 20px -12px rgba(22,33,31,.22);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101614; --card:#18201E; --sunk:#141B19;
    --ink:#E6EDEA; --muted:#9DAEA9; --faint:#7B8C87;
    --line:#2A3532; --line-soft:#222B29;
    --accent:#5FC7B2; --accent-soft:#1B322D; --accent-ink:#8FDCCB;
    --good:#63BE92; --good-soft:#172C22;
    --miss:#DF9A6E; --miss-soft:#301F16;
    --amber:#D8AE5C; --amber-soft:#2B2415;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101614; --card:#18201E; --sunk:#141B19;
  --ink:#E6EDEA; --muted:#9DAEA9; --faint:#7B8C87;
  --line:#2A3532; --line-soft:#222B29;
  --accent:#5FC7B2; --accent-soft:#1B322D; --accent-ink:#8FDCCB;
  --good:#63BE92; --good-soft:#172C22;
  --miss:#DF9A6E; --miss-soft:#301F16;
  --amber:#D8AE5C; --amber-soft:#2B2415;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.6; margin:0;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif; font-weight:600; text-wrap:balance; margin:0; line-height:1.2}
h1{font-size:clamp(1.6rem,4.5vw,2.15rem); letter-spacing:-.012em}
h2{font-size:1.3rem}
h3{font-size:1.05rem}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer; border:0; background:none}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px; border-radius:6px}
.wrap{max-width:660px; margin:0 auto; padding:0 20px 96px}
.eyebrow{font-size:.72rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint)}
.tnum{font-variant-numeric:tabular-nums}

/* header */
header{
  position:sticky; top:0; z-index:20; background:var(--paper);
  border-bottom:1px solid var(--line-soft);
}
.hbar{max-width:660px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:12px}
.mark{font-family:Fraunces,Georgia,serif; font-weight:700; font-size:1.06rem; letter-spacing:-.01em}
.mark span{color:var(--accent)}
.hspacer{flex:1}
.ghost{
  padding:7px 13px; border-radius:999px; border:1px solid var(--line);
  font-size:.83rem; font-weight:600; color:var(--muted); background:var(--card);
}
.ghost:hover{border-color:var(--accent); color:var(--accent)}

/* cards */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:14px}
.pad{padding:18px 20px}

/* home */
.hero{padding:26px 0 18px}
.hero p{color:var(--muted); margin-top:8px; max-width:52ch}
.nowcard{padding:18px 20px; border-left:4px solid var(--accent)}
.nowcard .eyebrow{color:var(--accent)}
.nowrow{display:flex; align-items:baseline; gap:10px; margin-top:6px; flex-wrap:wrap}
.nowrow strong{font-family:Fraunces,Georgia,serif; font-size:1.35rem; font-weight:600}
.nowrow em{font-style:normal; color:var(--muted); font-size:.92rem}

.subjects{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.subj{
  display:flex; flex-direction:column; gap:9px; padding:16px 17px; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  transition:border-color .15s, transform .15s;
}
.subj:hover{border-color:var(--accent); transform:translateY(-1px)}
.subj .nm{font-family:Fraunces,Georgia,serif; font-size:1.12rem; font-weight:600}
.subj .sub{font-size:.83rem; color:var(--muted)}
.subj .meter{margin-top:auto}
.meter{height:5px; border-radius:99px; background:var(--sunk); overflow:hidden}
.meter i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}

/* week / set list */
.rowbtn{
  display:flex; align-items:center; gap:14px; width:100%; text-align:left;
  padding:14px 18px; border-bottom:1px solid var(--line-soft); background:none;
}
.rowbtn:last-child{border-bottom:0}
.rowbtn:hover{background:var(--sunk)}
.rowbtn .lead{flex:1; min-width:0; display:flex; flex-direction:column; gap:2px}
.rowbtn .t{font-weight:600}
.rowbtn .s{font-size:.83rem; color:var(--muted)}
.pill{
  font-size:.73rem; font-weight:700; padding:3px 9px; border-radius:99px;
  background:var(--sunk); color:var(--muted); white-space:nowrap;
}
.pill.done{background:var(--good-soft); color:var(--good)}
.pill.part{background:var(--amber-soft); color:var(--amber)}
.chev{color:var(--faint); flex:none}

/* runner */
.rail{display:flex; gap:4px; margin:18px 0 6px}
.rail i{flex:1; height:4px; border-radius:99px; background:var(--sunk)}
.rail i.on{background:var(--accent)}
.rail i.cur{background:var(--accent-ink)}
.qmeta{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:14px}
.passage{
  background:var(--sunk); border:1px solid var(--line-soft); border-radius:var(--r);
  padding:18px 20px; margin-bottom:16px; max-height:15.5em; overflow-y:auto;
}
.passage h3{font-size:.98rem; margin-bottom:8px}
.passage p{font-size:.95rem; line-height:1.68; color:var(--ink)}
.qtext{font-size:1.16rem; line-height:1.45; font-weight:500; margin-bottom:18px; text-wrap:pretty}
.opts{display:flex; flex-direction:column; gap:9px}
.opt{
  display:flex; gap:13px; align-items:flex-start; width:100%; text-align:left;
  padding:13px 15px; border:1.5px solid var(--line); border-radius:12px;
  background:var(--card); transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--accent)}
.opt .ltr{
  flex:none; width:26px; height:26px; border-radius:7px; background:var(--sunk);
  display:grid; place-items:center; font-size:.82rem; font-weight:700; color:var(--muted);
}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt[aria-pressed="true"] .ltr{background:var(--accent); color:#fff}
.opt.good{border-color:var(--good); background:var(--good-soft)}
.opt.good .ltr{background:var(--good); color:#fff}
.opt.bad{border-color:var(--miss); background:var(--miss-soft)}
.opt.bad .ltr{background:var(--miss); color:#fff}

.bar{
  position:fixed; left:0; right:0; bottom:0; background:var(--card);
  border-top:1px solid var(--line); padding:12px 20px calc(12px + env(safe-area-inset-bottom));
}
.barin{max-width:660px; margin:0 auto; display:flex; align-items:center; gap:12px}
.btn{
  padding:12px 22px; border-radius:11px; background:var(--accent); color:#fff;
  font-weight:600; font-size:.97rem;
}
.btn:hover{background:var(--accent-ink)}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.btn.sec{background:var(--sunk); color:var(--ink)}
.btn.sec:hover{background:var(--line)}
.hint{font-size:.82rem; color:var(--faint); flex:1}

/* results */
.score{text-align:center; padding:30px 20px 24px}
.score .big{font-family:Fraunces,Georgia,serif; font-size:3.1rem; font-weight:600; line-height:1; letter-spacing:-.02em}
.score .of{color:var(--muted); font-size:1rem; margin-top:8px}
.score .msg{margin-top:14px; color:var(--muted); max-width:36ch; margin-left:auto; margin-right:auto}
.rev{padding:16px 18px; border-bottom:1px solid var(--line-soft)}
.rev:last-child{border-bottom:0}
.rev .tag{display:inline-flex; align-items:center; gap:6px; font-size:.74rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.rev .tag.g{color:var(--good)} .rev .tag.b{color:var(--miss)}
.rev .q{margin:7px 0 9px; font-weight:500; line-height:1.45}
.rev .ans{font-size:.9rem; color:var(--muted); display:block}
.rev .ans b{color:var(--ink); font-weight:600}
.rev .why{
  margin-top:10px; padding:11px 13px; background:var(--sunk); border-radius:10px;
  font-size:.9rem; line-height:1.6; color:var(--muted);
}
.empty{padding:44px 24px; text-align:center; color:var(--muted)}
.empty h3{color:var(--ink); margin-bottom:8px}
.sechead{display:flex; align-items:baseline; gap:10px; margin:26px 0 12px}
.sechead h2{flex:1}
.back{font-size:.88rem; font-weight:600; color:var(--accent); padding:6px 0}
.brk{display:flex; gap:12px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line-soft); color:var(--muted); font-size:.9rem}
.brk:last-child{border-bottom:0}
.brk .d{font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="mark">Sheila<span>·</span>ISEE</div>
    <div class="hspacer"></div>
    <button class="ghost" id="themeBtn" type="button">Theme</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="bar" id="bar" hidden><div class="barin" id="barin"></div></div>



<script>
(function () {
  'use strict';
  var D = window.__ISEE__;
  var SUBJ = {
    vr: { name: 'Verbal Reasoning', blurb: 'Vocabulary and sentence completion' },
    qr: { name: 'Quantitative Reasoning', blurb: 'Reasoning with numbers, no calculator' },
    ma: { name: 'Mathematics', blurb: 'Arithmetic, geometry, data' },
    rc: { name: 'Reading', blurb: 'Passages and comprehension' }
  };
  var ORDER = ['vr', 'qr', 'ma', 'rc'];
  var SETSIZE = 12;
  var LTR = ['A', 'B', 'C', 'D'];
  var app = document.getElementById('app');
  var bar = document.getElementById('bar');
  var barin = document.getElementById('barin');

  /* ---------- storage: one viewer, one browser, best effort ---------- */
  var KEY = 'isee.v1';
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  }
  function save(s) {
    try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { /* private mode */ }
  }
  var S = load();
  S.results = S.results || {};   // setId -> {n, right, at, wrong:[itemId]}
  S.theme = S.theme || null;

  /* ---------- theme ---------- */
  function applyTheme() {
    if (S.theme) document.documentElement.setAttribute('data-theme', S.theme);
    else document.documentElement.removeAttribute('data-theme');
  }
  applyTheme();
  document.getElementById('themeBtn').addEventListener('click', function () {
    var dark = S.theme
      ? S.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme = dark ? 'light' : 'dark';
    applyTheme(); save(S);
  });

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
  function itemsFor(sub, wk) { return D.subjects[sub].filter(function (i) { return i.w === wk; }); }
  function setsFor(sub, wk) {
    var all = itemsFor(sub, wk), out = [];
    for (var i = 0; i < all.length; i += SETSIZE) out.push(all.slice(i, i + SETSIZE));
    return out;
  }
  function setId(sub, wk, n) { return sub + ':' + wk + ':' + n; }
  function weekLabel(w) {
    for (var i = 0; i < D.weeks.length; i++) if (D.weeks[i].w === w) return D.weeks[i].label;
    return w;
  }
  /* Which week is live today, by the re-dated plan. */
  function currentWeek() {
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var best = null;
    D.weeks.forEach(function (w) {
      var d = new Date(D.starts[w.w] + 'T00:00:00');
      if (d <= today) best = w.w;
    });
    return best || 'W1';
  }
  function subjProgress(sub) {
    var done = 0, total = 0;
    D.weeks.forEach(function (w) {
      setsFor(sub, w.w).forEach(function (set, n) {
        total++;
        if (S.results[setId(sub, w.w, n)]) done++;
      });
    });
    return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
  }
  function allWrong() {
    var seen = {}, out = [];
    Object.keys(S.results).forEach(function (k) {
      var sub = k.split(':')[0];
      (S.results[k].wrong || []).forEach(function (id) {
        if (seen[id]) return; seen[id] = 1;
        var it = D.subjects[sub].filter(function (x) { return x.id === id; })[0];
        if (it) out.push({ sub: sub, it: it });
      });
    });
    return out;
  }
  function setBar(html) {
    if (!html) { bar.hidden = true; barin.innerHTML = ''; return; }
    bar.hidden = false; barin.innerHTML = html;
  }
  function go(fn) { window.scrollTo(0, 0); fn(); }

  /* ---------- home ---------- */
  function home() {
    setBar(null);
    var cur = currentWeek(), misses = allWrong().length;
    var h = '<div class="hero"><h1>Practice, one set at a time</h1>'
      + '<p>Every question from your Google Sheets, ready to work through here. '
      + 'Answers stay hidden until you finish a set — same as the sheets.</p></div>';

    h += '<div class="stack">';
    h += '<div class="card nowcard"><div class="eyebrow">This week</div>'
      + '<div class="nowrow"><strong>' + esc(cur) + '</strong><em>' + esc(weekLabel(cur)) + '</em></div></div>';

    if (misses) {
      h += '<button class="card rowbtn" data-nav="review" type="button">'
        + '<span class="lead"><span class="t">Review what you missed</span>'
        + '<span class="s">' + misses + ' question' + (misses === 1 ? '' : 's') + ' to try again</span></span>'
        + '<span class="pill part">' + misses + '</span><span class="chev">›</span></button>';
    }
    h += '</div>';

    h += '<div class="sechead"><h2>Subjects</h2></div><div class="subjects">';
    ORDER.forEach(function (s) {
      var p = subjProgress(s);
      h += '<button class="subj" data-sub="' + s + '" type="button">'
        + '<span class="nm">' + esc(SUBJ[s].name) + '</span>'
        + '<span class="sub">' + esc(SUBJ[s].blurb) + '</span>'
        + '<span class="meter"><i style="width:' + p.pct + '%"></i></span>'
        + '<span class="sub tnum">' + p.done + ' of ' + p.total + ' sets done</span></button>';
    });
    h += '</div>';

    h += '<div class="sechead"><h2>Weeks off the rotation</h2></div><div class="card">';
    D.breaks.forEach(function (b) {
      h += '<div class="brk"><span class="d tnum">' + esc(b.label) + '</span><span>' + esc(b.what) + '</span></div>';
    });
    h += '</div>';
    app.innerHTML = h;
  }

  /* ---------- subject -> weeks ---------- */
  function subject(sub) {
    setBar(null);
    var h = '<div class="sechead"><button class="back" data-nav="home" type="button">‹ All subjects</button></div>'
      + '<div class="hero" style="padding-top:6px"><h1>' + esc(SUBJ[sub].name) + '</h1>'
      + '<p>' + esc(SUBJ[sub].blurb) + '</p></div><div class="card">';
    D.weeks.forEach(function (w) {
      var sets = setsFor(sub, w.w), done = 0;
      sets.forEach(function (_, n) { if (S.results[setId(sub, w.w, n)]) done++; });
      var cls = done === sets.length && sets.length ? 'done' : (done ? 'part' : '');
      var lab = sets.length ? (done + '/' + sets.length + ' sets') : 'none';
      h += '<button class="rowbtn" data-sub="' + sub + '" data-week="' + w.w + '" type="button">'
        + '<span class="lead"><span class="t">' + esc(w.w) + ' · ' + esc(w.label) + '</span>'
        + '<span class="s">' + itemsFor(sub, w.w).length + ' questions</span></span>'
        + '<span class="pill ' + cls + '">' + lab + '</span><span class="chev">›</span></button>';
    });
    app.innerHTML = h + '</div>';
  }

  /* ---------- week -> sets ---------- */
  function week(sub, wk) {
    setBar(null);
    var sets = setsFor(sub, wk);
    var h = '<div class="sechead"><button class="back" data-sub-back="' + sub + '" type="button">‹ '
      + esc(SUBJ[sub].name) + '</button></div>'
      + '<div class="hero" style="padding-top:6px"><h1>' + esc(wk) + '</h1>'
      + '<p>' + esc(weekLabel(wk)) + ' · ' + sets.length + ' sets of about ' + SETSIZE + ' questions. '
      + 'Each set is one sitting.</p></div><div class="card">';
    sets.forEach(function (set, n) {
      var r = S.results[setId(sub, wk, n)];
      var pill = r
        ? '<span class="pill ' + (r.right / r.n >= 0.75 ? 'done' : 'part') + ' tnum">'
          + r.right + '/' + r.n + '</span>'
        : '<span class="pill">not started</span>';
      h += '<button class="rowbtn" data-run="' + sub + '|' + wk + '|' + n + '" type="button">'
        + '<span class="lead"><span class="t">Set ' + (n + 1) + '</span>'
        + '<span class="s">' + set.length + ' questions' + (r ? ' · done' : '') + '</span></span>'
        + pill + '<span class="chev">›</span></button>';
    });
    app.innerHTML = h + '</div>';
  }

  /* ---------- the runner ---------- */
  var R = null;
  function run(sub, wk, n, custom) {
    R = { sub: sub, wk: wk, n: n, items: custom || setsFor(sub, wk)[n], i: 0, picks: [], custom: !!custom };
    paint();
  }
  function paint() {
    var it = R.items[R.i], total = R.items.length;
    var h = '<div class="rail">';
    for (var j = 0; j < total; j++) {
      h += '<i class="' + (j < R.i ? 'on' : (j === R.i ? 'cur' : '')) + '"></i>';
    }
    h += '</div><div class="qmeta"><span class="eyebrow">' + esc(SUBJ[R.sub].name)
      + ' · ' + esc(R.custom ? 'Review' : R.wk + ' Set ' + (R.n + 1)) + '</span>'
      + '<span class="eyebrow tnum">' + (R.i + 1) + ' / ' + total + '</span></div>';

    if (it.p && D.passages[it.p]) {
      var pg = D.passages[it.p];
      h += '<div class="passage">' + (pg.t ? '<h3>' + esc(pg.t) + '</h3>' : '')
        + '<p>' + esc(pg.x).replace(/\n+/g, '</p><p>') + '</p></div>';
    }
    h += '<div class="qtext">' + esc(it.q) + '</div><div class="opts">';
    it.c.forEach(function (c, k) {
      var on = R.picks[R.i] === k;
      h += '<button class="opt" type="button" data-pick="' + k + '" aria-pressed="' + (on ? 'true' : 'false') + '">'
        + '<span class="ltr">' + LTR[k] + '</span><span>' + esc(c) + '</span></button>';
    });
    app.innerHTML = h + '</div>';

    var last = R.i === R.items.length - 1;
    setBar('<button class="btn sec" data-step="-1" type="button"' + (R.i ? '' : ' disabled') + '>Back</button>'
      + '<span class="hint">' + (R.picks[R.i] == null ? 'Pick an answer' : 'Press Enter to continue') + '</span>'
      + '<button class="btn" data-step="1" type="button"' + (R.picks[R.i] == null ? ' disabled' : '')
      + '>' + (last ? 'Finish set' : 'Next') + '</button>');
  }
  function step(d) {
    if (d > 0 && R.picks[R.i] == null) return;
    if (d > 0 && R.i === R.items.length - 1) return finish();
    R.i = Math.max(0, R.i + d);
    go(paint);
  }
  function finish() {
    var right = 0, wrong = [];
    R.items.forEach(function (it, j) {
      if (LTR[R.picks[j]] === it.k) right++; else wrong.push(it.id);
    });
    if (!R.custom) {
      S.results[setId(R.sub, R.wk, R.n)] =
        { n: R.items.length, right: right, at: Date.now(), wrong: wrong };
    } else {
      // a review round clears the ones she got right this time
      Object.keys(S.results).forEach(function (k) {
        var r = S.results[k];
        r.wrong = (r.wrong || []).filter(function (id) {
          var idx = -1;
          R.items.forEach(function (it, j) { if (it.id === id) idx = j; });
          return idx === -1 ? true : LTR[R.picks[idx]] !== R.items[idx].k;
        });
      });
    }
    save(S);
    go(results.bind(null, right));
  }
  function results(right) {
    var total = R.items.length, pct = Math.round(right / total * 100);
    var msg = pct >= 85 ? 'Strong set. Read the notes on anything you guessed.'
      : pct >= 60 ? 'Solid. The notes below are where the next few marks are.'
      : 'This one was hard. Work through the notes slowly — that is the part that moves the score.';
    var h = '<div class="card score"><div class="big tnum">' + right + '</div>'
      + '<div class="of tnum">out of ' + total + ' · ' + pct + '%</div>'
      + '<div class="msg">' + esc(msg) + '</div></div>'
      + '<div class="sechead"><h2>Every question</h2></div><div class="card">';
    R.items.forEach(function (it, j) {
      var ok = LTR[R.picks[j]] === it.k;
      var yours = R.picks[j] == null ? '—' : LTR[R.picks[j]] + '. ' + it.c[R.picks[j]];
      h += '<div class="rev"><span class="tag ' + (ok ? 'g' : 'b') + '">'
        + (ok ? '✓ Correct' : '✕ Missed') + '</span>'
        + '<div class="q">' + esc(it.q) + '</div>'
        + '<div class="ans">Your answer: <b>' + esc(yours) + '</b></div>'
        + (ok ? '' : '<div class="ans">Correct: <b>' + esc(it.k + '. ' + it.c[LTR.indexOf(it.k)]) + '</b></div>')
        + (it.e ? '<div class="why">' + esc(it.e) + '</div>' : '')
        + '</div>';
    });
    app.innerHTML = h + '</div>';
    setBar('<button class="btn sec" data-nav="home" type="button">Home</button>'
      + '<span class="hint"></span>'
      + (R.custom ? '<button class="btn" data-nav="review" type="button">Back to review</button>'
        : '<button class="btn" data-week-back="' + R.sub + '|' + R.wk + '" type="button">More sets</button>'));
  }

  /* ---------- review ---------- */
  function review() {
    setBar(null);
    var w = allWrong();
    var h = '<div class="sechead"><button class="back" data-nav="home" type="button">‹ Home</button></div>'
      + '<div class="hero" style="padding-top:6px"><h1>Review</h1>'
      + '<p>Questions you missed, gathered from every set. Get one right here and it leaves the list.</p></div>';
    if (!w.length) {
      app.innerHTML = h + '<div class="card empty"><h3>Nothing waiting</h3>'
        + '<p>Finish a set and anything you miss will collect here.</p></div>';
      return;
    }
    h += '<div class="card">';
    ORDER.forEach(function (s) {
      var mine = w.filter(function (x) { return x.sub === s; });
      if (!mine.length) return;
      h += '<button class="rowbtn" data-rev="' + s + '" type="button">'
        + '<span class="lead"><span class="t">' + esc(SUBJ[s].name) + '</span>'
        + '<span class="s">' + mine.length + ' to try again</span></span>'
        + '<span class="pill part tnum">' + mine.length + '</span><span class="chev">›</span></button>';
    });
    app.innerHTML = h + '</div>';
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-nav],[data-sub],[data-week],[data-run],[data-pick],[data-step],[data-sub-back],[data-week-back],[data-rev]');
    if (!t) return;
    if (t.dataset.pick != null) {
      R.picks[R.i] = +t.dataset.pick; paint(); return;
    }
    if (t.dataset.step) { step(+t.dataset.step); return; }
    if (t.dataset.run) {
      var p = t.dataset.run.split('|'); go(function () { run(p[0], p[1], +p[2]); }); return;
    }
    if (t.dataset.rev) {
      var items = allWrong().filter(function (x) { return x.sub === t.dataset.rev; })
        .map(function (x) { return x.it; });
      go(function () { run(t.dataset.rev, '', 0, items); }); return;
    }
    if (t.dataset.weekBack) { var q = t.dataset.weekBack.split('|'); go(function () { week(q[0], q[1]); }); return; }
    if (t.dataset.subBack) { go(subject.bind(null, t.dataset.subBack)); return; }
    if (t.dataset.week) { go(week.bind(null, t.dataset.sub, t.dataset.week)); return; }
    if (t.dataset.sub) { go(subject.bind(null, t.dataset.sub)); return; }
    if (t.dataset.nav === 'home') { go(home); return; }
    if (t.dataset.nav === 'review') { go(review); return; }
  });
  document.addEventListener('keydown', function (e) {
    if (!R || bar.hidden) return;
    var k = e.key.toUpperCase(), idx = LTR.indexOf(k);
    if (idx === -1 && k >= '1' && k <= '4') idx = +k - 1;
    if (idx > -1 && R.items && R.items[R.i]) { R.picks[R.i] = idx; paint(); e.preventDefault(); return; }
    if (e.key === 'Enter') { step(1); e.preventDefault(); }
    if (e.key === 'Backspace') { step(-1); e.preventDefault(); }
  });

  /* ---------- boot ---------- */
  function boot() { home(); }
  if (D) boot();
  else {
    fetch('content/bundle.json').then(function (r) { return r.json(); })
      .then(function (j) { D = j; boot(); })
      .catch(function () {
        app.innerHTML = '<div class="card empty" style="margin-top:40px">'
          + '<h3>Questions could not load</h3><p>content/bundle.json did not load. '
          + 'If you opened this file directly, serve the folder over http instead.</p></div>';
      });
  }
})();
</script>

<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js")});</script>
</body>
</html>
