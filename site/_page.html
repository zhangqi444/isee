<title>Sheila's ISEE Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F2F5F4; --card:#FFFFFF; --sunk:#E7ECEA;
  --ink:#16211F; --muted:#5C6B68; --faint:#8A9995;
  --line:#D8E0DD; --line-soft:#E7ECEA;
  --accent:#0F7A6B; --accent-soft:#DCEBE7; --accent-ink:#0A5A4E;
  --good:#2E7D5B; --good-soft:#DDEEE4;
  --miss:#B4653A; --miss-soft:#F6E5DC;
  --amber:#9C6F16; --amber-soft:#F5EAD2;
  --shadow:0 1px 2px rgba(22,33,31,.05), 0 6px 20px -12px rgba(22,33,31,.22);
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101614; --card:#18201E; --sunk:#141B19;
    --ink:#E6EDEA; --muted:#9DAEA9; --faint:#7B8C87;
    --line:#2A3532; --line-soft:#222B29;
    --accent:#5FC7B2; --accent-soft:#1B322D; --accent-ink:#8FDCCB;
    --good:#63BE92; --good-soft:#172C22;
    --miss:#DF9A6E; --miss-soft:#301F16;
    --amber:#D8AE5C; --amber-soft:#2B2415;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101614; --card:#18201E; --sunk:#141B19;
  --ink:#E6EDEA; --muted:#9DAEA9; --faint:#7B8C87;
  --line:#2A3532; --line-soft:#222B29;
  --accent:#5FC7B2; --accent-soft:#1B322D; --accent-ink:#8FDCCB;
  --good:#63BE92; --good-soft:#172C22;
  --miss:#DF9A6E; --miss-soft:#301F16;
  --amber:#D8AE5C; --amber-soft:#2B2415;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--paper); color:var(--ink);
  font-family:"Public Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.6; margin:0; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(1.55rem,4.5vw,2.05rem);letter-spacing:-.012em}
h2{font-size:1.28rem}
h3{font-size:1.04rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* app frame */
.wrap{max-width:660px;margin:0 auto;padding:0 20px 132px}
header.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line-soft)}
.hbar{max-width:660px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.mark{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.04rem;letter-spacing:-.01em}
.mark span{color:var(--accent)}
.hspacer{flex:1}
.chipbtn{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:600;color:var(--muted);background:var(--card);display:inline-flex;align-items:center;gap:7px}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.chipbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--good)}
.dot.sync{background:var(--amber)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.hero{padding:22px 0 14px}
.hero p{color:var(--muted);margin-top:8px;max-width:52ch}
.sechead{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px}
.sechead h2{flex:1}
.back{font-size:.9rem;font-weight:600;color:var(--accent);padding:6px 0;display:inline-flex;gap:6px;align-items:center}

.nowcard{padding:18px 20px;border-left:4px solid var(--accent)}
.nowcard .eyebrow{color:var(--accent)}
.nowrow{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}
.nowrow strong{font-family:Fraunces,Georgia,serif;font-size:1.3rem;font-weight:600}
.nowrow em{font-style:normal;color:var(--muted);font-size:.92rem}
.todo{margin-top:12px;font-size:1.05rem;font-weight:500;line-height:1.45}
.todo b{color:var(--accent-ink)}

.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.subj{display:flex;flex-direction:column;gap:9px;padding:16px 17px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,transform .15s}
.subj:hover{border-color:var(--accent);transform:translateY(-1px)}
.subj .nm{font-family:Fraunces,Georgia,serif;font-size:1.1rem;font-weight:600}
.subj .sub{font-size:.83rem;color:var(--muted)}
.subj .meter{margin-top:auto}
.meter{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}

.rowbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 18px;border-bottom:1px solid var(--line-soft);background:none}
.rowbtn:last-child{border-bottom:0}
.rowbtn:hover{background:var(--sunk)}
.rowbtn .lead{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rowbtn .t{font-weight:600}
.rowbtn .s{font-size:.83rem;color:var(--muted)}
.chev{color:var(--faint);flex:none}
.pill{font-size:.73rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.part{background:var(--amber-soft);color:var(--amber)}

.brk{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line-soft);color:var(--muted);font-size:.9rem}
.brk:last-child{border-bottom:0}
.brk .d{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}

/* runner */
.rail{display:flex;gap:4px;margin:18px 0 6px}
.rail i{flex:1;height:4px;border-radius:99px;background:var(--sunk)}
.rail i.on{background:var(--accent)}
.rail i.cur{background:var(--accent-ink)}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.passage{background:var(--sunk);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;max-height:15.5em;overflow-y:auto}
.passage h3{font-size:.98rem;margin-bottom:8px}
.passage p{font-size:.95rem;line-height:1.68}
.qtext{font-size:1.16rem;line-height:1.45;font-weight:500;margin-bottom:18px;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:13px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--accent)}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:7px;background:var(--sunk);display:grid;place-items:center;font-size:.82rem;font-weight:700;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] .ltr{background:var(--accent);color:#fff}
.opt.good{border-color:var(--good);background:var(--good-soft)}
.opt.good .ltr{background:var(--good);color:#fff}
.opt.bad{border-color:var(--miss);background:var(--miss-soft)}
.opt.bad .ltr{background:var(--miss);color:#fff}

.bar{position:fixed;left:0;right:0;bottom:64px;background:var(--card);border-top:1px solid var(--line);padding:12px 20px}
.barin{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px}
.btn{padding:12px 22px;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;font-size:.97rem}
.btn:hover{background:var(--accent-ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sec{background:var(--sunk);color:var(--ink)}
.btn.sec:hover{background:var(--line)}
.hint{font-size:.82rem;color:var(--faint);flex:1}

.score{text-align:center;padding:28px 20px 22px}
.score .big{font-family:Fraunces,Georgia,serif;font-size:3rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.score .of{color:var(--muted);font-size:1rem;margin-top:8px}
.score .msg{margin-top:14px;color:var(--muted);max-width:36ch;margin-left:auto;margin-right:auto}
.rev{padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.rev:last-child{border-bottom:0}
.rev .tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.rev .tag.g{color:var(--good)} .rev .tag.b{color:var(--miss)}
.rev .q{margin:7px 0 9px;font-weight:500;line-height:1.45}
.rev .ans{font-size:.9rem;color:var(--muted);display:block}
.rev .ans b{color:var(--ink);font-weight:600}
.rev .why{margin-top:10px;padding:11px 13px;background:var(--sunk);border-radius:10px;font-size:.9rem;line-height:1.6;color:var(--muted)}
.empty{padding:44px 24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:8px}

/* global nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabsin{max-width:660px;margin:0 auto;display:flex}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 8px;color:var(--faint);background:none}
.tab.on{color:var(--accent)}
.tab svg{width:23px;height:23px}
.tab .lbl{font-size:.68rem;font-weight:600;letter-spacing:.02em}
.tab .badge{position:absolute;transform:translate(14px,-4px);background:var(--miss);color:#fff;font-size:.6rem;font-weight:700;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 3px}
.tabwrap{position:relative;flex:1;display:flex}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-size:.82rem;font-weight:600;padding:8px 14px;border-radius:99px;z-index:50;box-shadow:var(--shadow);opacity:.96}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/htm/3.1.1/htm.js"></script>
<script>
(function () {
  'use strict';
  var html = htm.bind(React.createElement);
  var h = React.createElement;
  var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo, useRef = React.useRef;

  var SUBJ = {
    vr: { name: 'Verbal Reasoning', blurb: 'Vocabulary and sentence completion' },
    qr: { name: 'Quantitative Reasoning', blurb: 'Reasoning with numbers, no calculator' },
    ma: { name: 'Mathematics', blurb: 'Arithmetic, geometry, data' },
    rc: { name: 'Reading', blurb: 'Passages and comprehension' }
  };
  var ORDER = ['vr', 'qr', 'ma', 'rc'];
  var SETSIZE = 12, LTR = ['A', 'B', 'C', 'D'];
  var CLIENT_ID = window.__OAUTH_CLIENT_ID__ || '';
  var DRIVE_ENABLED = !!window.__ENABLE_DRIVE__;
  var FOLDER = 'Sheila ISEE Practice';
  var KEY = 'isee.v1';

  /* ---------------- persistence: localStorage + Drive JSON ---------------- */
  function lsLoad() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function lsSave(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

  var Store = {
    s: null, listeners: [], drive: null, token: null, tokenExp: 0, folderId: null,
    fileId: null, syncing: false, pushTimer: null, status: 'local', email: null,
    init: function () {
      this.s = lsLoad();
      this.s.results = this.s.results || {};
      return this.s;
    },
    sub: function (fn) { this.listeners.push(fn); return function () {}; },
    emit: function () { this.listeners.forEach(function (f) { f(); }); },
    setStatus: function (v) { this.status = v; this.emit(); },
    applySeed: function (seed) {
      if (!seed || !seed.results) return;
      if ((this.s.seedApplied || 0) >= seed.version) return;
      var added = 0, self = this;
      Object.keys(seed.results).forEach(function (k) {
        if (!self.s.results[k]) { self.s.results[k] = seed.results[k]; added++; }
      });
      this.s.seedApplied = seed.version;
      lsSave(this.s);
      return added;
    },
    recordSet: function (setId, res) {
      this.s.results[setId] = res;
      lsSave(this.s);
      this.emit();
      this.schedulePush();
    },
    clearWrong: function (fn) {           // fn(result) -> new wrong[]
      var self = this;
      Object.keys(this.s.results).forEach(function (k) {
        var r = self.s.results[k];
        r.wrong = fn(k, r);
      });
      lsSave(this.s); this.emit(); this.schedulePush();
    },
    setTheme: function (t) { this.s.theme = t; lsSave(this.s); this.emit(); },

    /* ---- Drive ---- */
    signIn: function () {
      if (!DRIVE_ENABLED || !window.google || !google.accounts || !google.accounts.oauth2) {
        this.setStatus('unavailable'); return;
      }
      var self = this;
      if (!this.tc) {
        this.tc = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: 'https://www.googleapis.com/auth/drive.file openid email profile',
          callback: function (resp) {
            if (resp && resp.access_token) {
              self.token = resp.access_token;
              self.tokenExp = Date.now() + (resp.expires_in || 3600) * 1000 - 60000;
              self.afterAuth();
            } else { self.setStatus('local'); }
          }
        });
      }
      this.setStatus('connecting');
      this.tc.requestAccessToken({ prompt: this.token ? '' : 'consent' });
    },
    signOut: function () {
      this.token = null; this.tokenExp = 0; this.folderId = null; this.fileId = null;
      this.email = null; this.setStatus('local');
    },
    valid: function () { return this.token && Date.now() < this.tokenExp; },
    api: function (url, opts) {
      opts = opts || {}; opts.headers = opts.headers || {};
      opts.headers.Authorization = 'Bearer ' + this.token;
      return fetch(url, opts);
    },
    afterAuth: function () {
      var self = this;
      this.setStatus('syncing');
      this.api('https://www.googleapis.com/oauth2/v3/userinfo').then(function (r) { return r.json(); })
        .then(function (u) { self.email = u && u.email; }).catch(function () {})
        .then(function () { return self.ensureFolder(); })
        .then(function () { return self.pull(); })
        .then(function () { self.setStatus('live'); })
        .catch(function (e) { console.warn('drive sync failed', e); self.setStatus('error'); });
    },
    ensureFolder: function () {
      var self = this;
      var q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='" + FOLDER + "' and trashed=false");
      return this.api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d.files && d.files.length) { self.folderId = d.files[0].id; return; }
          return self.api('https://www.googleapis.com/drive/v3/files', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: FOLDER, mimeType: 'application/vnd.google-apps.folder' })
          }).then(function (r) { return r.json(); }).then(function (f) { self.folderId = f.id; });
        });
    },
    findFile: function () {
      var self = this;
      var q = encodeURIComponent("name='progress.json' and '" + this.folderId + "' in parents and trashed=false");
      return this.api('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)')
        .then(function (r) { return r.json(); })
        .then(function (d) { self.fileId = (d.files && d.files[0]) ? d.files[0].id : null; return self.fileId; });
    },
    pull: function () {
      var self = this;
      return this.findFile().then(function (id) {
        if (!id) return self.push();       // nothing remote yet -> seed it from local
        return self.api('https://www.googleapis.com/drive/v3/files/' + id + '?alt=media')
          .then(function (r) { return r.json(); })
          .then(function (remote) { self.merge(remote); self.push(); });
      });
    },
    merge: function (remote) {
      if (!remote || !remote.results) return;
      var local = this.s.results;
      Object.keys(remote.results).forEach(function (k) {
        var rr = remote.results[k], lr = local[k];
        if (!lr || (rr.at || '') >= (lr.at || '')) local[k] = rr;   // last-write-wins by timestamp
      });
      lsSave(this.s); this.emit();
    },
    schedulePush: function () {
      if (!this.valid() || !this.folderId) return;
      var self = this;
      clearTimeout(this.pushTimer);
      this.pushTimer = setTimeout(function () { self.push(); }, 1200);
    },
    push: function () {
      if (!this.valid() || !this.folderId) return Promise.resolve();
      var self = this;
      var body = JSON.stringify({ schema: 1, savedAt: new Date().toISOString(), results: this.s.results });
      var meta = { name: 'progress.json', mimeType: 'application/json' };
      if (this.fileId) {
        return this.api('https://www.googleapis.com/upload/drive/v3/files/' + this.fileId + '?uploadType=media',
          { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: body });
      }
      meta.parents = [this.folderId];
      var boundary = 'iseebnd' + Date.now();
      var multipart = '--' + boundary + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' +
        JSON.stringify(meta) + '\r\n--' + boundary +
        '\r\nContent-Type: application/json\r\n\r\n' + body + '\r\n--' + boundary + '--';
      return this.api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + boundary }, body: multipart })
        .then(function (r) { return r.json(); }).then(function (f) { self.fileId = f.id; });
    }
  };

  /* ---------------- content helpers ---------------- */
  var D = null;
  function esc(s) { return s == null ? '' : String(s); }
  function itemsFor(sub, wk) { return D.subjects[sub].filter(function (i) { return i.w === wk; }); }
  function setsFor(sub, wk) {
    var all = itemsFor(sub, wk), out = [];
    for (var i = 0; i < all.length; i += SETSIZE) out.push(all.slice(i, i + SETSIZE));
    return out;
  }
  function setId(sub, wk, n) { return sub + ':' + wk + ':' + n; }
  function weekLabel(w) { for (var i = 0; i < D.weeks.length; i++) if (D.weeks[i].w === w) return D.weeks[i].label; return w; }
  function currentWeek() {
    var today = new Date(); today.setHours(0, 0, 0, 0); var best = 'W1';
    D.weeks.forEach(function (w) { if (new Date(D.starts[w.w] + 'T00:00:00') <= today) best = w.w; });
    return best;
  }
  function subjProgress(sub) {
    var done = 0, total = 0;
    D.weeks.forEach(function (w) { setsFor(sub, w.w).forEach(function (_, n) { total++; if (Store.s.results[setId(sub, w.w, n)]) done++; }); });
    return { done: done, total: total, pct: total ? Math.round(done / total * 100) : 0 };
  }
  function allWrong() {
    var seen = {}, out = [];
    Object.keys(Store.s.results).forEach(function (k) {
      var sub = k.split(':')[0];
      (Store.s.results[k].wrong || []).forEach(function (id) {
        if (seen[id] || !D.subjects[sub]) return; seen[id] = 1;
        var it = D.subjects[sub].filter(function (x) { return x.id === id; })[0];
        if (it) out.push({ sub: sub, it: it });
      });
    });
    return out;
  }

  /* ---------------- tiny hash router ---------------- */
  function useRoute() {
    var parse = function () { return (location.hash || '#/').replace(/^#/, '').split('/').filter(Boolean); };
    var st = useState(parse); var parts = st[0], set = st[1];
    useEffect(function () {
      var on = function () { set(parse()); window.scrollTo(0, 0); };
      addEventListener('hashchange', on); return function () { removeEventListener('hashchange', on); };
    }, []);
    return parts;
  }
  function go(path) { location.hash = path; }

  /* ---------------- icons ---------------- */
  function Icon(p) {
    var paths = {
      home: 'M3 10.5 12 3l9 7.5M5 9.5V20h14V9.5',
      review: 'M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4',
      book: 'M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z'
    };
    return html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d=${paths[p.n]}/></svg>`;
  }

  /* ---------------- screens ---------------- */
  function Home() {
    var cur = currentWeek(), misses = allWrong().length;
    var today = D.plan && D.plan[cur] ? D.plan[cur] : null;
    return html`
      <div class="hero"><h1>Practice, one set at a time</h1>
        <p>Every question from your Google Sheets, ready here. Answers stay hidden until you finish a set — same as the sheets.</p></div>
      <div class="stack">
        <div class="card nowcard">
          <div class="eyebrow">This week</div>
          <div class="nowrow"><strong>${cur}</strong><em>${weekLabel(cur)}</em></div>
          ${today ? html`<div class="todo">Today: <b>${today}</b></div>` : null}
        </div>
        ${misses ? html`<button class="card rowbtn" onClick=${function () { go('/review'); }}>
          <span class="lead"><span class="t">Review what you missed</span>
          <span class="s">${misses} question${misses === 1 ? '' : 's'} to try again</span></span>
          <span class="pill part">${misses}</span><span class="chev">›</span></button>` : null}
      </div>
      <div class="sechead"><h2>Subjects</h2></div>
      <div class="subjects">
        ${ORDER.map(function (s) {
          var p = subjProgress(s);
          return html`<button class="subj" key=${s} onClick=${function () { go('/s/' + s); }}>
            <span class="nm">${SUBJ[s].name}</span>
            <span class="sub">${SUBJ[s].blurb}</span>
            <span class="meter"><i style=${{ width: p.pct + '%' }}></i></span>
            <span class="sub tnum">${p.done} of ${p.total} sets done</span></button>`;
        })}
      </div>
      <div class="sechead"><h2>Weeks off the rotation</h2></div>
      <div class="card">${(D.breaks || []).map(function (b, i) {
        return html`<div class="brk" key=${i}><span class="d tnum">${b.label}</span><span>${b.what}</span></div>`;
      })}</div>`;
  }

  function SubjectView(p) {
    var sub = p.sub;
    return html`<div>
      <div class="sechead"><button class="back" onClick=${function () { go('/'); }}>‹ All subjects</button></div>
      <div class="hero" style=${{ paddingTop: '6px' }}><h1>${SUBJ[sub].name}</h1><p>${SUBJ[sub].blurb}</p></div>
      <div class="card">${D.weeks.map(function (w) {
        var sets = setsFor(sub, w.w), done = 0;
        sets.forEach(function (_, n) { if (Store.s.results[setId(sub, w.w, n)]) done++; });
        var cls = (done === sets.length && sets.length) ? 'done' : (done ? 'part' : '');
        return html`<button class="rowbtn" key=${w.w} onClick=${function () { go('/s/' + sub + '/' + w.w); }}>
          <span class="lead"><span class="t">${w.w} · ${w.label}</span>
          <span class="s">${itemsFor(sub, w.w).length} questions</span></span>
          <span class="pill ${cls}">${sets.length ? done + '/' + sets.length + ' sets' : 'none'}</span>
          <span class="chev">›</span></button>`;
      })}</div></div>`;
  }

  function WeekView(p) {
    var sub = p.sub, wk = p.wk, sets = setsFor(sub, wk);
    return html`<div>
      <div class="sechead"><button class="back" onClick=${function () { go('/s/' + sub); }}>‹ ${SUBJ[sub].name}</button></div>
      <div class="hero" style=${{ paddingTop: '6px' }}><h1>${wk}</h1>
        <p>${weekLabel(wk)} · ${sets.length} sets of about ${SETSIZE} questions. Each set is one sitting.</p></div>
      <div class="card">${sets.map(function (set, n) {
        var r = Store.s.results[setId(sub, wk, n)];
        var pill = r ? html`<span class="pill ${r.right / r.n >= 0.75 ? 'done' : 'part'} tnum">${r.right}/${r.n}</span>`
                     : html`<span class="pill">not started</span>`;
        return html`<button class="rowbtn" key=${n} onClick=${function () { go('/run/' + sub + '/' + wk + '/' + n); }}>
          <span class="lead"><span class="t">Set ${n + 1}</span>
          <span class="s">${set.length} questions${r ? ' · done' : ''}</span></span>
          ${pill}<span class="chev">›</span></button>`;
      })}</div></div>`;
  }

  function Runner(p) {
    var items = p.items, title = p.title, custom = p.custom;
    var iSt = useState(0), i = iSt[0], setI = iSt[1];
    var pSt = useState([]), picks = pSt[0], setPicks = pSt[1];
    var doneSt = useState(null), done = doneSt[0], setDone = doneSt[1];
    var it = items[i], total = items.length;

    function choose(k) { var np = picks.slice(); np[i] = k; setPicks(np); }
    function step(d) {
      if (d > 0 && picks[i] == null) return;
      if (d > 0 && i === total - 1) return finish();
      setI(Math.max(0, i + d)); window.scrollTo(0, 0);
    }
    function finish() {
      var right = 0, wrong = [];
      items.forEach(function (q, j) { if (LTR[picks[j]] === q.correct || LTR[picks[j]] === q.k) right++; else wrong.push(q.id); });
      var key = function (q) { return q.k || q.correct; };
      right = 0; wrong = [];
      items.forEach(function (q, j) { if (LTR[picks[j]] === key(q)) right++; else wrong.push(q.id); });
      if (!custom) {
        Store.recordSet(p.setId, { n: items.length, right: right, at: new Date().toISOString(), wrong: wrong });
      } else {
        var gotIds = {};
        items.forEach(function (q, j) { if (LTR[picks[j]] === key(q)) gotIds[q.id] = 1; });
        Store.clearWrong(function (k, r) { return (r.wrong || []).filter(function (id) { return !gotIds[id]; }); });
      }
      setDone({ right: right });
      window.scrollTo(0, 0);
    }

    useEffect(function () {
      var on = function (e) {
        if (done) return;
        var k = (e.key || '').toUpperCase(), idx = LTR.indexOf(k);
        if (idx === -1 && e.key >= '1' && e.key <= '4') idx = +e.key - 1;
        if (idx > -1 && it) { choose(idx); e.preventDefault(); }
        else if (e.key === 'Enter') { step(1); e.preventDefault(); }
        else if (e.key === 'Backspace') { step(-1); e.preventDefault(); }
      };
      addEventListener('keydown', on); return function () { removeEventListener('keydown', on); };
    });

    if (done) {
      var pct = Math.round(done.right / total * 100);
      var msg = pct >= 85 ? 'Strong set. Read the notes on anything you guessed.'
        : pct >= 60 ? 'Solid. The notes below are where the next few marks are.'
        : 'This one was hard. Work through the notes slowly — that is what moves the score.';
      var keyf = function (q) { return q.k || q.correct; };
      return html`<div>
        <div class="card score"><div class="big tnum">${done.right}</div>
          <div class="of tnum">out of ${total} · ${pct}%</div>
          <div class="msg">${msg}</div></div>
        <div class="sechead"><h2>Every question</h2></div>
        <div class="card">${items.map(function (q, j) {
          var ok = LTR[picks[j]] === keyf(q);
          var yours = picks[j] == null ? '—' : LTR[picks[j]] + '. ' + q.c[picks[j]];
          return html`<div class="rev" key=${j}>
            <span class="tag ${ok ? 'g' : 'b'}">${ok ? '✓ Correct' : '✕ Missed'}</span>
            <div class="q">${q.q}</div>
            <div class="ans">Your answer: <b>${yours}</b></div>
            ${ok ? null : html`<div class="ans">Correct: <b>${keyf(q) + '. ' + q.c[LTR.indexOf(keyf(q))]}</b></div>`}
            ${q.e ? html`<div class="why">${q.e}</div>` : null}
          </div>`;
        })}</div>
        <div class="bar"><div class="barin">
          <button class="btn sec" onClick=${function () { go('/'); }}>Home</button>
          <span class="hint"></span>
          <button class="btn" onClick=${function () { history.back(); }}>Back to ${custom ? 'review' : 'sets'}</button>
        </div></div></div>`;
    }

    var last = i === total - 1;
    return html`<div>
      <div class="rail">${items.map(function (_, j) {
        return html`<i key=${j} class=${j < i ? 'on' : (j === i ? 'cur' : '')}></i>`;
      })}</div>
      <div class="qmeta"><span class="eyebrow">${title}</span><span class="eyebrow tnum">${i + 1} / ${total}</span></div>
      ${it.p && D.passages[it.p] ? html`<div class="passage">
        ${D.passages[it.p].t ? html`<h3>${D.passages[it.p].t}</h3>` : null}
        ${D.passages[it.p].x.split(/\n+/).map(function (para, k) { return html`<p key=${k} style=${{ marginTop: k ? '.7em' : 0 }}>${para}</p>`; })}
      </div>` : null}
      <div class="qtext">${it.q}</div>
      <div class="opts">${it.c.map(function (c, k) {
        return html`<button class="opt" key=${k} aria-pressed=${picks[i] === k} onClick=${function () { choose(k); }}>
          <span class="ltr">${LTR[k]}</span><span>${c}</span></button>`;
      })}</div>
      <div class="bar"><div class="barin">
        <button class="btn sec" onClick=${function () { step(-1); }} disabled=${i === 0}>Back</button>
        <span class="hint">${picks[i] == null ? 'Pick an answer' : 'Press Enter to continue'}</span>
        <button class="btn" onClick=${function () { step(1); }} disabled=${picks[i] == null}>${last ? 'Finish set' : 'Next'}</button>
      </div></div></div>`;
  }

  function Review() {
    var w = allWrong();
    if (!w.length) return html`<div>
      <div class="hero"><h1>Review</h1><p>Questions you missed, gathered from every set. Get one right here and it leaves the list.</p></div>
      <div class="card empty"><h3>Nothing waiting</h3><p>Finish a set and anything you miss collects here.</p></div></div>`;
    return html`<div>
      <div class="hero"><h1>Review</h1><p>Questions you missed, gathered from every set. Get one right and it leaves the list.</p></div>
      <div class="card">${ORDER.map(function (s) {
        var mine = w.filter(function (x) { return x.sub === s; });
        if (!mine.length) return null;
        return html`<button class="rowbtn" key=${s} onClick=${function () { go('/review/' + s); }}>
          <span class="lead"><span class="t">${SUBJ[s].name}</span><span class="s">${mine.length} to try again</span></span>
          <span class="pill part tnum">${mine.length}</span><span class="chev">›</span></button>`;
      })}</div></div>`;
  }

  /* ---------------- app shell ---------------- */
  function App() {
    var parts = useRoute();
    var tick = useState(0), setTick = tick[1];
    var stStatus = useState(Store.status), status = stStatus[0], setSt = stStatus[1];
    var toast = useState(null), toastMsg = toast[0], setToast = toast[1];
    useEffect(function () {
      var unsub = Store.sub(function () { setTick(function (x) { return x + 1; }); setSt(Store.status); });
      return unsub;
    }, []);

    // theme
    function toggleTheme() {
      var dark = Store.s.theme ? Store.s.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      var t = dark ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t); Store.setTheme(t);
    }

    var screen, activeTab = 'home';
    if (parts[0] === 's' && parts[2]) screen = html`<${WeekView} sub=${parts[1]} wk=${parts[2]}/>`;
    else if (parts[0] === 's') screen = html`<${SubjectView} sub=${parts[1]}/>`;
    else if (parts[0] === 'run') {
      var sub = parts[1], wk = parts[2], n = +parts[3];
      var set = setsFor(sub, wk)[n];
      screen = set ? html`<${Runner} key=${'run' + sub + wk + n} items=${set} setId=${setId(sub, wk, n)}
        title=${SUBJ[sub].name + ' · ' + wk + ' Set ' + (n + 1)}/>` : html`<${Home}/>`;
    } else if (parts[0] === 'review' && parts[1]) {
      activeTab = 'review';
      var items = allWrong().filter(function (x) { return x.sub === parts[1]; }).map(function (x) { return x.it; });
      screen = items.length ? html`<${Runner} key=${'rev' + parts[1] + items.length} items=${items} custom=${true}
        title=${SUBJ[parts[1]].name + ' · Review'}/>` : html`<${Review}/>`;
    } else if (parts[0] === 'review') { activeTab = 'review'; screen = html`<${Review}/>`; }
    else screen = html`<${Home}/>`;

    var reviewCount = allWrong().length;
    var statusLabel = { local: 'Save to Drive', connecting: 'Connecting…', syncing: 'Syncing…', live: 'Saved to Drive', error: 'Retry sync', unavailable: '' };
    var statusDot = status === 'live' ? 'live' : (status === 'syncing' || status === 'connecting' ? 'sync' : '');

    return html`<div>
      <header class="top"><div class="hbar">
        <div class="mark">Sheila<span>·</span>ISEE</div>
        <div class="hspacer"></div>
        ${DRIVE_ENABLED ? html`<button class="chipbtn ${status === 'live' ? 'on' : ''}"
          onClick=${function () { if (status === 'live') { Store.signOut(); } else { Store.signIn(); } }}
          title=${Store.email || ''}>
          <span class="dot ${statusDot}"></span>${status === 'live' ? 'Saved to Drive' : statusLabel[status]}</button>` : null}
        <button class="chipbtn" onClick=${toggleTheme}>Theme</button>
      </div></header>
      <main class="wrap">${screen}</main>
      ${toastMsg ? html`<div class="toast">${toastMsg}</div>` : null}
      <nav class="tabs"><div class="tabsin">
        <div class="tabwrap"><button class="tab ${activeTab === 'home' ? 'on' : ''}" onClick=${function () { go('/'); }}>
          <${Icon} n="home"/><span class="lbl">Home</span></button></div>
        <div class="tabwrap"><button class="tab ${activeTab === 'review' ? 'on' : ''}" onClick=${function () { go('/review'); }}>
          <${Icon} n="review"/><span class="lbl">Review</span>${reviewCount ? html`<span class="badge">${reviewCount}</span>` : null}</button></div>
      </div></nav>
    </div>`;
  }

  /* ---------------- boot ---------------- */
  function start() {
    Store.init();
    if (Store.s.theme) document.documentElement.setAttribute('data-theme', Store.s.theme);
    if (D.seed) Store.applySeed(D.seed);
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
    // auto-connect Drive if the library is present and we've signed in before this session
    if (DRIVE_ENABLED && Store.s.driveOptIn) setTimeout(function () { Store.signIn(); }, 400);
  }
  if (window.__ISEE__) { D = window.__ISEE__; start(); }
  else {
    fetch('content/bundle.json').then(function (r) { return r.json(); }).then(function (j) { D = j; start(); })
      .catch(function () {
        document.getElementById('root').innerHTML = '<div class="wrap"><div class="card empty" style="margin-top:40px">'
          + '<h3>Questions could not load</h3><p>content/bundle.json did not load.</p></div></div>';
      });
  }
  // remember opt-in so future visits reconnect silently
  var _si = Store.signIn.bind(Store);
  Store.signIn = function () { Store.s.driveOptIn = true; lsSave(Store.s); return _si(); };
})();
</script>
